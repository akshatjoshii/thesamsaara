        fields:
          - { name: image, label: 'Banner photo (landscape, ~1920 px wide)', type: image, required: true }
          - { name: alt, label: Banner photo description, type: string }
          - { name: representative, label: 'Show "Representative image" label (tick if not taken at The Samsaara)', type: boolean }
          - { name: eyebrow, label: Small text above the heading, type: string }
          - { name: title, label: Heading, type: string }
          - { name: subtitle, label: Sub-heading, type: text }
      - name: photos
        label: 'Photo strip below the intro'
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string }
      - { name: photosNote, label: 'Small note under the photo strip (leave empty to hide)', type: string }
      - name: seo
        label: Google & share preview
        type: object
        fields:
          - { name: title, label: 'Page title for Google (~60 characters; {price} = starting price)', type: string }
          - { name: description, label: 'Description for Google (~155 characters)', type: text }
          - { name: image, label: 'Share image (leave empty to use the default)', type: image }

  - name: page-wedding
