        type: object
        fields:
          - { name: image, label: 'Banner photo (landscape, ~1920 px wide)', type: image, required: true }
          - { name: alt, label: Banner photo description, type: string }
          - { name: representative, label: 'Show "Representative image" label (tick if not taken at The Samsaara)', type: boolean }
          - { name: eyebrow, label: Small text above the heading, type: string }
          - { name: title, label: Heading, type: string }
          - { name: subtitle, label: Sub-heading, type: text }
      - name: foodPhotos
        label: '"From our kitchen" photos'
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string }
      - name: stayPhoto
        label: '"Staying with us?" photo'
        type: object
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string }
      - name: seo
        label: Google & share preview
        type: object
        fields:
          - { name: title, label: 'Page title for Google (~60 characters; {price} = starting price)', type: string }
          - { name: description, label: 'Description for Google (~155 characters)', type: text }
          - { name: image, label: 'Share image (leave empty to use the default)', type: image }


  # ───────────── Cottages & camping ─────────────
  - name: stay
    label: Cottages & camping
    type: file
    path: src/data/stay.json
    format: json
    fields:
      - name: cottages
        label: Cottage tiers
        type: object
        list: true
        fields:
          - { name: name, type: string }
          - { name: slug, label: Slug (no spaces), type: string }
          - { name: price, label: Price text, type: string }
          - { name: image, type: image, required: true }
          - { name: alt, label: 'Image description (for Google & accessibility)', type: string }
          - { name: beds, type: string }
          - { name: description, type: text }
          - { name: features, type: string, list: true }
      - name: camping
        label: Camping
        type: object
        fields:
          - { name: tents, label: Number of tents, type: number }
          - { name: price, label: Price text, type: string }
          - { name: features, type: string, list: true }

  # ───────────── Reviews ─────────────
  - name: reviews
    label: Guest reviews
    type: file
    path: src/data/reviews.json
    format: json
    fields:
      - name: items
        label: Reviews (real Google reviews only)
        type: object
        list: true
        fields:
          - { name: name, label: Guest name, type: string }
          - { name: rating, label: Stars (1–5), type: number }
          - { name: text, label: Review, type: text }
          - { name: date, label: Date (e.g. Oct 2026), type: string }

  # ───────────── FAQs ─────────────
  - name: faqs
    label: FAQs
    type: file
    path: src/data/faqs.json
    format: json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
          - name: tags
            label: Show on pages
            type: select
            list: true
            options:
              values: [general, stay, camping, wedding, corporate, school, birthday]

  # ───────────── Café menu ─────────────
  - name: menu
    label: Café menu
    type: file
    path: src/data/menu.json
    format: json
    fields:
      - { name: note, label: Intro note, type: text }
      - name: categories
        type: object
        list: true
        fields:
          - { name: name, label: Category, type: string }
          - name: items
            type: object
            list: true
            fields:
              - { name: name, type: string }
              - { name: veg, label: Vegetarian, type: boolean }
              - { name: highlight, label: Must-try, type: boolean }

  # ───────────── Experiences ─────────────
  - name: experiences
    label: Experiences
    type: file
    path: src/data/experiences.json
    format: json
    fields:
      - name: items
        type: object
        list: true
        fields:
          - { name: id, label: ID (no spaces), type: string }
          - { name: name, type: string }
          - { name: image, type: image, required: true }
          - { name: alt, label: Image description, type: string }
          - { name: text, type: text }

  # ───────────── Gallery ─────────────
  - name: gallery
    label: Gallery
    type: file
    path: src/data/gallery.json
    format: json
    fields:
      - { name: categories, type: string, list: true }
      - name: items
        label: Photos
        type: object
        list: true
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: Description (for Google & accessibility), type: string }
          - { name: category, type: string }

  # ───────────── Blog ─────────────
  - name: blog
    label: Travel guides (blog)
    type: collection
    path: src/content/blog
    filename: "{fields.title}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
    fields:
      - { name: title, type: string, required: true }
      - { name: description, label: Meta description (~155 chars), type: text, required: true }
      - { name: date, type: date, required: true }
      - { name: image, label: Cover image, type: image }
      - { name: imageAlt, label: Cover image description, type: string }
      - name: cta
        label: Call to action button
        type: object
        fields:
          - { name: label, type: string }
          - { name: href, label: Link, type: string }
      - { name: draft, type: boolean }
      - { name: body, label: Article, type: rich-text }
