# Pages CMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, open this repo, and edit content with simple forms.

media:
  input: public/images
  output: /images

content:
  # ───────────── Site settings: prices, offer banner, contact ─────────────
  - name: site
    label: Site settings & prices
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Resort name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - name: branding
        label: Logos, favicon & share image
        type: object
        fields:
          - { name: headerLogo, label: Header logo (small mark), type: image, required: true }
          - { name: footerLogo, label: Footer logo (full), type: image, required: true }
          - { name: favicon, label: 'Favicon (square PNG, 512×512)', type: image, required: true }
          - { name: appleTouchIcon, label: 'iPhone home-screen icon (square PNG, 180×180)', type: image, required: true }
          - { name: shareImage, label: 'Default share image for WhatsApp/Facebook previews (1200×630 JPG)', type: image, required: true }
      - { name: startingPrice, label: Starting price (₹ per person per night), type: number }
      - { name: priceNote, label: Price note shown after the price, type: string }
      - { name: mealPlan, label: Meal plan label, type: string }
      - name: offerBanner
        label: Offer banner (top of every page)
        type: object
        fields:
          - { name: enabled, label: Show banner, type: boolean }
          - { name: text, label: Banner text, type: string }
          - { name: link, label: Banner link, type: string }
      - name: googleRating
        label: Google rating (only show if it matches your real Google profile)
        type: object
        fields:
          - { name: show, label: Show rating, type: boolean }
          - { name: rating, label: Rating (e.g. 4.5), type: number }
          - { name: count, label: Number of reviews, type: number }
      - { name: phone, label: Phone (display), type: string }
      - { name: phoneRaw, label: Phone (for calls, +91…), type: string }
      - { name: whatsapp, label: WhatsApp number (digits only, with 91), type: string }
      - { name: email, label: Email, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: googleProfile, label: Google Maps profile URL, type: string }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, type: string }
          - { name: locality, type: string }
          - { name: region, type: string }
          - { name: postalCode, type: string }
          - { name: country, type: string }
      - name: geo
        label: Map coordinates
        type: object
        fields:
          - { name: lat, label: Latitude, type: number }
          - { name: lng, label: Longitude, type: number }
      - name: distances
        label: Distances (How to Reach)
        type: object
        list: true
        fields:
          - { name: from, type: string }
          - { name: distance, type: string }
          - { name: time, type: string }
      - name: integrations
        label: Integrations
        type: object
        fields:
          - { name: web3formsKey, label: Web3Forms access key, type: string }
          - { name: ga4Id, label: Google Analytics 4 ID (G-XXXX), type: string }

  # ───────────── Page photos & text (one form per page) ─────────────
  - name: page-home
    label: 'Page: Home'
    type: file
    path: src/data/pages/home.json
    format: json
    fields:
      - name: hero
        label: Top banner
        type: object
        fields:
          - { name: image, label: 'Banner photo (landscape, ~1920 px wide)', type: image, required: true }
          - { name: alt, label: Banner photo description, type: string }
          - { name: representative, label: 'Show "Representative image" label (tick if not taken at The Samsaara)', type: boolean }
          - { name: eyebrow, label: Small text above the heading, type: string }
          - { name: title, label: Heading, type: string }
          - { name: subtitle, label: Sub-heading, type: text }
      - name: stayCards
        label: Stay cards (Cottages / Camping)
        type: object
        fields:
          - name: cottages
            label: 'Cottages card'
            type: object
            fields:
              - { name: image, label: Photo, type: image, required: true }
              - { name: alt, label: Photo description, type: string }
          - name: camping
            label: 'Camping card'
            type: object
            fields:
              - { name: image, label: Photo, type: image, required: true }
              - { name: alt, label: Photo description, type: string }
      - name: occasions
        label: '"Plan your occasion" cards'
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string }
          - { name: title, type: string }
          - { name: text, type: text }
          - { name: href, label: 'Link (e.g. /destination-wedding/)', type: string }
      - name: cafeTeaser
        label: 'Café section photo'
        type: object
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string }
      - name: seo
        label: Google & share preview
        type: object
        fields:
          - { name: title, label: 'Page title for Google (~60 characters; {price} = starting price)', type: string }
          - { name: description, label: 'Description for Google (~155 characters)', type: text }
          - { name: image, label: 'Share image (leave empty to use the default)', type: image }

  - name: page-stay
    label: 'Page: Cottages (photos of each tier are under "Cottages & camping")'
    type: file
    path: src/data/pages/stay.json
    format: json
    fields:
      - name: hero
        label: Top banner
        type: object
        fields:
          - { name: image, label: 'Banner photo (landscape, ~1920 px wide)', type: image, required: true }
          - { name: alt, label: Banner photo description, type: string }
          - { name: representative, label: 'Show "Representative image" label (tick if not taken at The Samsaara)', type: boolean }
          - { name: eyebrow, label: Small text above the heading, type: string }
          - { name: title, label: Heading, type: string }
          - { name: subtitle, label: Sub-heading, type: text }
      - name: seo
        label: Google & share preview
        type: object
        fields:
          - { name: title, label: 'Page title for Google (~60 characters; {price} = starting price)', type: string }
          - { name: description, label: 'Description for Google (~155 characters)', type: text }
          - { name: image, label: 'Share image (leave empty to use the default)', type: image }

  - name: page-camping
    label: 'Page: Riverside camping'
    type: file
    path: src/data/pages/camping.json
    format: json
    fields:
      - name: hero
        label: Top banner
